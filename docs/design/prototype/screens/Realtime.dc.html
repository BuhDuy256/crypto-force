<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:1100}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { live: true, layout: 4, tfs: ['1m', '5m', '15m', '1h'], sigSrc: 'MA Crossover', onboardHidden: !!this.store('onboardHidden') };
    var sg = this.store('signal');
    if (sg) { var hit = this.lib().filter(function (x) { return x.id === sg.id; })[0]; if (hit) this.state.sigSrc = hit.name; else { this.state.sigMissing = sg.name || 'Your signal source'; this.unstore('signal'); } }
  }
  libSeed() {
    return [
      { id: 'st-rsi-bb', kind: 'strategy', name: 'RSI_BB_LB_LONG_SL2_TP4' },
      { id: 'st-macd', kind: 'strategy', name: 'MACD_Cross_TrendFollow' },
      { id: 'cp-ma-rsi-sr', kind: 'composite', name: 'MA + RSI + S/R' }
    ];
  }
  lib() { try { var v = window.localStorage.getItem('cf.library'); return v ? JSON.parse(v) : this.libSeed(); } catch (e) { return this.libSeed(); } }
  actionsCfg() { return { load: { idle: 'Load 1,000 past candles', busy: 'Loading candles\u2026', msg: 'Demo: example candles shown; no market data was fetched.' } }; }
  pageVals() {
    var self = this, G = '#3DD68C', R = '#FF6B5E';
    function rng(seed) { var s = (seed * 9973) % 2147483647 || 1; return function () { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; }; }
    function makeChart(spec) {
      var r = rng(spec.seed), n = 64, p = 100, ks = [], i, j;
      for (i = 0; i < n; i++) {
        var o = p, c = o + (r() - 0.5 + spec.drift) * 2;
        var h = Math.max(o, c) + r() * 0.9, l = Math.min(o, c) - r() * 0.9;
        ks.push({ o: o, c: c, h: h, l: l, v: (0.18 + r() * 0.45) * (r() > 0.86 ? 1.8 : 1) });
        p = c;
      }
      var lo = Infinity, hi = -Infinity;
      ks.forEach(function (k) { lo = Math.min(lo, k.l); hi = Math.max(hi, k.h); });
      var pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
      function Y(v) { return (hi - v) / (hi - lo) * 100; }
      var step = 100 / n;
      var candles = ks.map(function (k, i) {
        var up = k.c >= k.o, t = Y(Math.max(k.o, k.c)), b = Y(Math.min(k.o, k.c));
