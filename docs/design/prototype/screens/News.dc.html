<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News – Crypto Force</title>
<link rel="preload" href="../assets/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<script src="../vendor/react/react.production.min.js"></script>
<script src="../vendor/react/react-dom.production.min.js"></script>
<script src="../tools/dc-source.js"></script>
<script src="../vendor/dc-runtime/support.js"></script>

</head>
<body>
<script type="text/x-template" data-dc-template>
<x-dc>
<helmet>
<link rel="stylesheet" href="../styles/layout-audit.css">
<style id="cf-audit-layout-fixes">
/* News: at small widths, place summary ahead of long data feed. */
.cf-news-content > section, .cf-news-content > aside {min-width:0;}
/* Feed flows independently (length varies with filters). Sentiment + "Use in strategies" travel together
   as one rail: sticky beside the feed instead of leaving a stretched/empty column.
   Sources & extraction is maintenance for the whole page → shared block below, its expand only pushes page end. */
@media(min-width:1250px){.cf-news-content>aside{position:sticky;top:16px;align-self:start;}}
@media(min-width:1250px){.cf-news-content{display:grid !important;grid-template-columns:minmax(0,1.65fr) minmax(320px,.95fr);gap:24px !important;align-items:start !important;}}
@media(max-width:1249px){.cf-news-content{display:flex !important;flex-direction:column !important;gap:18px !important;}
 .cf-news-content>section,.cf-news-content>aside{width:100% !important;flex:1 1 100% !important;}
 .cf-news-content>aside{display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px !important;align-items:start !important;}
}
@media(max-width:720px){
 .cf-news-content>aside{display:contents !important;}
 .cf-news-content>aside>section:first-child{order:-1;width:100%;}
 .cf-news-content>aside>section:nth-of-type(2){order:2;width:100%;}
 .cf-news-content>section{padding:16px !important;}
 .cf-news-content table{min-width:0 !important;width:100% !important;}
 .cf-news-content thead{display:none !important;}
 .cf-news-content tbody tr{display:grid !important;grid-template-columns:1fr 1fr;gap:8px;padding:14px 0 !important;border-bottom:1px solid #33404C;}
 .cf-news-content tbody td{display:block !important;padding:0 !important;width:auto !important;min-width:0;}
 .cf-news-content tbody td:nth-child(1){grid-column:1;grid-row:1;font-size:12px !important;}
 .cf-news-content tbody td:nth-child(2){grid-column:2;grid-row:1;text-align:right;}
 .cf-news-content tbody td:nth-child(3){grid-column:1 / -1;grid-row:2;}
 .cf-news-content tbody td:nth-child(4){grid-column:1;grid-row:3;}
 .cf-news-content tbody td:nth-child(5){grid-column:2;grid-row:3;text-align:right;}
}
</style>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../styles/base.css">
</helmet>
<div style="min-height: 100vh; background: #0B0E12; color: #E7ECF2; font-family: Onest, system-ui, sans-serif; font-variant-numeric: tabular-nums lining-nums">
<div style="position: sticky; top: 0; z-index: 30"><dc-import name="AppHeader" active="nw" hint-size="100%,61px"></dc-import></div>
<main class="cf-audited-main cf-news-layout" style="max-width: 1640px; margin: 0 auto; padding: 24px 28px 40px; display: flex; flex-direction: column; gap: 24px">
<div role="note" style="border:1px solid #334155;border-radius:7px;padding:8px 12px;background:#111923;color:#AFC2D6;font-size:12px;line-height:1.4;max-width:100%;box-sizing:border-box">UI prototype: prices, backtests, news, account state and workflow feedback are illustrative. No live market, AI or account service is connected in this HTML file.</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -0.03em">News</h1>
<p style="margin: 0; font-size: 15px; color: #9AA6B4">Review news by asset, examine extracted fields and sentiment, and use that context only when a strategy rule specifies it.</p>
</div>

<form aria-label="Crawl settings" style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px 24px; padding: 16px 16px; background: #12171E; border: 1px solid #252D38; border-radius: 12px">
<div style="display: flex; flex-direction: column; gap: 8px"><span id="lbl-src" style="font-size: 13px; font-weight: 700">Source type</span>
<div role="group" aria-labelledby="lbl-src" style="display: flex; border: 1px solid #3A4553; border-radius: 8px; overflow: hidden">
<sc-for list="{{sources}}" as="s" hint-placeholder-count="3"><button type="button" onClick="{{s.pick}}" aria-pressed="{{s.on}}" class="cf-ghost" style="min-height: 40px; padding: 0 16px; border: 0; border-left: 1px solid #2F3945; font-size: 14px; font-weight: 600; cursor: pointer; background: {{s.bg}}; color: {{s.fg}}">{{s.label}}</button></sc-for>
</div></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="n-asset" style="font-size: 13px; font-weight: 700">Assets</label><select id="n-asset" style="height: 42px; min-width: 160px; padding: 0 12px; border: 1px solid #3A4553; border-radius: 8px; background: #0F141A; font-size: 14px"><option>BTC, ETH, SOL</option><option>BTC</option><option>ETH</option><option>SOL</option></select></div>
<div style="display: flex; flex-direction: column; gap: 8px"><span id="lbl-ref" style="font-size: 13px; font-weight: 700">Refresh every</span>
<div role="group" aria-labelledby="lbl-ref" style="display: flex; border: 1px solid #3A4553; border-radius: 8px; overflow: hidden">
<sc-for list="{{refresh}}" as="r" hint-placeholder-count="5"><button type="button" onClick="{{r.pick}}" aria-pressed="{{r.on}}" class="cf-ghost" style="min-height: 40px; padding: 0 16px; border: 0; border-left: 1px solid #2F3945; font-size: 14px; font-weight: 600; cursor: pointer; background: {{r.bg}}; color: {{r.fg}}">{{r.label}}</button></sc-for>
</div></div>
<div style="margin-left: auto; display: flex; gap: 12px">
<button type="button" onClick="{{openSources}}" aria-haspopup="dialog" class="cf-sec" style="min-height: 42px; padding: 0 16px; border: 1px solid #3A4553; border-radius: 8px; background: none; font-size: 14px; font-weight: 600; cursor: pointer">Configure sources</button>
<button type="button" onClick="{{toggleCrawl}}" disabled="{{act.crawl.busy}}" aria-busy="{{act.crawl.busy}}" class="cf-pri" style="display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 0 20px; border: 0; border-radius: 8px; background: #E7ECF2; color: #0B0E12; font-size: 15px; font-weight: 700; cursor: pointer"><sc-if value="{{act.crawl.busy}}" hint-placeholder-val="{{false}}"><svg class="cf-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"></path></svg></sc-if>{{crawlLabel}}</button>
</div>
</form>

<div class="cf-news-content" style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
<section aria-labelledby="n-feed" style="flex: 1.6 1 600px; min-width: 0; background: #12171E; border: 1px solid #252D38; border-radius: 12px; padding: 16px 20px">
<div style="display: flex; align-items: baseline"><h2 id="n-feed" style="margin: 0; font-size: 17px; font-weight: 600">Incoming news</h2><span style="margin-left: auto; font-size: 13px; color: #9AA6B4">Example feed · 10:45</span></div>
<div role="group" aria-label="Filter by sentiment" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px">
<sc-for list="{{filters}}" as="fl" hint-placeholder-count="4"><button type="button" onClick="{{fl.pick}}" aria-pressed="{{fl.on}}" class="cf-sec" style="min-height: 36px; padding: 0 12px; border: 1px solid {{fl.bd}}; border-radius: 999px; background: {{fl.bg}}; color: {{fl.fg}}; font-size: 13px; font-weight: 600; cursor: pointer">{{fl.label}} <span style="font-weight: 400">{{fl.count}}</span></button></sc-for>
</div>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 620px; border-collapse: collapse; margin-top: 8px">
<thead><tr style="border-bottom: 1px solid #2F3945; font-size: 13px; color: #9AA6B4; text-align: left"><th style="font-weight: 600; padding: 8px 0; width: 56px">Time</th><th style="font-weight: 600; width: 56px">Asset</th><th style="font-weight: 600">Headline</th><th style="font-weight: 600; width: 120px">Sentiment</th><th style="font-weight: 600; width: 112px">Source</th></tr></thead>
<tbody>
<sc-for list="{{shownNews}}" as="n" hint-placeholder-count="6">
<tr style="border-bottom: 1px solid #232B35; vertical-align: top">
<td style="padding: 12px 0; font-size: 14px; color: #9AA6B4">{{n.time}}</td>
<td style="padding: 12px 0"><span style="padding: 2px 8px; border: 1px solid #3A4553; font-size: 12px; font-weight: 600">{{n.asset}}</span></td>
<td style="padding: 12px 16px 12px 0"><button type="button" onClick="{{n.open}}" aria-haspopup="dialog" class="cf-ghost" style="display: block; padding: 0; border: 0; background: none; color: #E7ECF2; font-size: 16px; font-weight: 700; line-height: 1.35; text-align: left; cursor: pointer">{{n.title}}</button><p style="margin: 4px 0 0; font-size: 14px; line-height: 1.5; color: #C3CCD6; max-width: 75ch">{{n.sum}}</p></td>
<td style="padding: 12px 0"><span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: {{n.sc}}"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{n.sc}}"></span>{{n.sent}}</span><div style="margin-top: 4px; font-size: 12px; color: #9AA6B4">{{n.ev}}</div></td>
<td style="padding: 12px 0; font-size: 14px">{{n.src}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<sc-if value="{{feedEmpty}}" hint-placeholder-val="{{false}}"><p role="status" style="margin: 12px 0 0; padding: 16px; border: 1px dashed #374456; border-radius: 10px; background: #0E141B; font-size: 14px; line-height: 1.5; color: #C3CCD6">{{feedEmptyText}}</p></sc-if>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin-top: 12px; font-size: 13px; color: #9AA6B4"><span>{{feedCount}}</span><sc-if value="{{hiddenBySource}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{openSources}}" class="cf-ghost" style="min-height: 36px; padding: 0; border: 0; background: none; color: #7AA2FF; font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">{{hiddenText}}</button></sc-if></div>
</section>

<aside style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 24px">
<section aria-labelledby="n-sent" style="background: #12171E; border: 1px solid #252D38; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline"><h2 id="n-sent" style="margin: 0; font-size: 17px; font-weight: 600">Sentiment, last 24h</h2><span style="margin-left: auto; font-size: 13px; color: #9AA6B4">10:45</span></div>
<div role="img" aria-label="Positive 58%, neutral 27%, negative 15%" style="display: flex; height: 36px; font-size: 13px; font-weight: 600; color: #151A21">
<span style="flex: 58; background: #3DD68C; display: flex; align-items: center; padding-left: 8px">58%</span>
<span style="flex: 27; background: #9AA6B4; display: flex; align-items: center; padding-left: 8px">27%</span>
<span style="flex: 15; background: #FF6B5E; display: flex; align-items: center; padding-left: 8px">15%</span>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.5"><span style="color: #3DD68C; font-weight: 600">Positive up 6 pts</span> and <span style="color: #FF6B5E; font-weight: 600">negative down 4 pts</span> vs the previous 24h. <span style="color: #9AA6B4">Mostly driven by ETF / fund-flow stories.</span></p>
<div style="display: flex; gap: 20px; font-size: 13px"><span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; background: #3DD68C"></span>Positive</span><span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; background: #9AA6B4"></span>Neutral</span><span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; background: #FF6B5E"></span>Negative</span></div>
<table style="width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 4px">
<thead><tr style="border-bottom: 1px solid #2F3945; font-size: 13px; color: #9AA6B4; text-align: left"><th style="font-weight: 600; padding: 8px 0">Top event types</th><th style="font-weight: 600; text-align: right">Share</th><th style="width: 40%"></th></tr></thead>
<tbody>
<sc-for list="{{events}}" as="ev" hint-placeholder-count="5"><tr style="border-bottom: 1px solid #232B35"><td style="padding: 8px 0">{{ev.k}}</td><td style="text-align: right; font-weight: 700">{{ev.v}}%</td><td style="padding-left: 12px"><div style="height: 6px; background: #232B35"><div style="height: 100%; width: {{ev.w}}; background: #E7ECF2"></div></div></td></tr></sc-for>
</tbody>
</table>
<dl style="margin: 4px 0 0; display: grid; grid-template-columns: 1fr auto; font-size: 14px">
<dt style="padding: 8px 0; border-bottom: 1px solid #232B35; color: #9AA6B4">Average confidence</dt><dd style="margin: 0; padding: 8px 0; border-bottom: 1px solid #232B35; font-weight: 700">0.78</dd>
<dt style="padding: 8px 0; border-bottom: 1px solid #232B35; color: #9AA6B4">Articles analysed (24h)</dt><dd style="margin: 0; padding: 8px 0; border-bottom: 1px solid #232B35; font-weight: 700">1,248</dd>
<dt style="padding: 8px 0; border-bottom: 1px solid #232B35; color: #9AA6B4">Source coverage</dt><dd style="margin: 0; padding: 8px 0; border-bottom: 1px solid #232B35; font-weight: 700">92% <span style="font-weight: 400; color: #9AA6B4">(23 of 25 active)</span></dd>
</dl>
</section>

<section aria-labelledby="n-use" style="background: #12171E; border: 1px solid #252D38; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
<h2 id="n-use" style="margin: 0; font-size: 17px; font-weight: 600">Use in strategies</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.55; color: #C3CCD6">Sentiment is an optional strategy input. Check that the corresponding rule and data integration are configured before using it.</p>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="Strategy.dc.html" onClick="{{addCondition}}" class="cf-sec" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border: 1px solid #3A4553; border-radius: 8px; color: #E7ECF2; font-size: 14px; font-weight: 700; text-decoration: none">Add as a condition</a>
<a href="Strategy.dc.html" onClick="{{openSample}}" class="cf-ghost" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 4px; font-size: 14px; font-weight: 600">Start a sentiment strategy (sample)</a>
</div>
</section>
</aside>
</div>

<section aria-labelledby="n-ops" style="background: #12171E; border: 1px solid #252D38; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px">
<h2 id="n-ops" style="margin: 0; font-size: 17px; font-weight: 600">Sources &amp; extraction</h2>
<span style="font-size: 14px; color: #C3CCD6">{{srcSummary}} · template {{currentVer}} · <span style="color: #F2B544">example errors 11.9%, a proposed fix is shown</span></span>
<button type="button" onClick="{{toggleOps}}" aria-expanded="{{opsOpen}}" aria-controls="n-ops-body" class="cf-sec" style="margin-left: auto; display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border: 1px solid #3A4553; border-radius: 8px; background: none; color: #E7ECF2; font-size: 14px; font-weight: 600; cursor: pointer">{{opsLabel}}<svg style="transform: {{opsRot}}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
<sc-if value="{{opsOpen}}" hint-placeholder-val="{{false}}">
<div id="n-ops-body">
<div style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
<section aria-labelledby="n-ext" style="flex: 1 1 560px; min-width: 0; background: #12171E; border: 1px solid #252D38; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px"><h2 id="n-ext" style="margin: 0; font-size: 17px; font-weight: 600">How articles are extracted</h2><span style="margin-left: auto; font-size: 13px; font-weight: 700; color: #3DD68C">Template {{currentVer}} active</span></div>
<ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid #232B35; border-left: 1px solid #232B35">
<li style="padding: 12px 12px; border-right: 1px solid #232B35; border-bottom: 1px solid #232B35; display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 14px">Fetch raw HTML</strong><span style="font-size: 13px; line-height: 1.45; color: #9AA6B4">from each source page</span></li>
<li style="padding: 12px 12px; border-right: 1px solid #232B35; border-bottom: 1px solid #232B35; display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 14px">Identify article fields</strong><span style="font-size: 13px; line-height: 1.45; color: #9AA6B4">Title, summary, source, time and asset · example confidence 0.92</span></li>
<li style="padding: 12px 12px; border-right: 1px solid #232B35; border-bottom: 1px solid #232B35; display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 14px">Write a template</strong><span style="font-size: 13px; line-height: 1.45; color: #9AA6B4">5 fields · score 0.92</span></li>
<li style="padding: 12px 12px; border-right: 1px solid #232B35; border-bottom: 1px solid #232B35; display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 14px">Version it</strong><span style="font-size: 13px; line-height: 1.45; color: #9AA6B4">every change kept and reversible</span></li>
</ol>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<pre style="flex: 1 1 260px; margin: 0; padding: 12px; background: #151A21; border: 1px solid #333D4A; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.6; overflow-x: auto">{
  "title":   "h1.article-title",
  "summary": "p.summary",
  "source":  "span.source",
  "time":    "time",
  "asset":   "meta[content]"
}</pre>
<table style="flex: 1 1 220px; border-collapse: collapse; font-size: 14px; align-self: flex-start">
<caption style="text-align: left; font-size: 13px; font-weight: 700; padding-bottom: 8px">Template versions</caption>
<tbody>
<tr style="border-top: 1px solid #2F3945; border-bottom: 1px solid #232B35"><td style="padding: 8px 0; font-weight: 600">{{currentVer}}</td><td style="color: #9AA6B4">18/05/2025 10:32</td><td style="text-align: right; color: #3DD68C; font-weight: 700">Current</td></tr>
<tr style="border-bottom: 1px solid #232B35"><td style="padding: 8px 0">v1.4.1</td><td style="color: #9AA6B4">17/05/2025 09:10</td><td style="text-align: right"><button type="button" onClick="{{restore141}}" class="cf-ghost" style="padding: 0; border: 0; background: none; color: #7AA2FF; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Restore</button></td></tr>
<tr style="border-bottom: 1px solid #232B35"><td style="padding: 8px 0">v1.4.0</td><td style="color: #9AA6B4">16/05/2025 16:22</td><td style="text-align: right"><button type="button" onClick="{{restore140}}" class="cf-ghost" style="padding: 0; border: 0; background: none; color: #7AA2FF; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Restore</button></td></tr>
</tbody>
</table>
</div>
</section>

<section aria-labelledby="n-heal" style="flex: 1 1 520px; min-width: 0; background: #12171E; border: 1px solid #252D38; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px"><h2 id="n-heal" style="margin: 0; font-size: 17px; font-weight: 600">Self-healing</h2><span style="padding: 2px 8px; border: 1px solid #5A4520; border-radius: 6px; font-size: 12px; font-weight: 600; color: #F2D28B">Under review · not in current scope</span>
<span id="lbl-heal" style="margin-left: auto; font-size: 14px; font-weight: 600">{{healLabel}}</span>
<button type="button" role="switch" aria-checked="{{heal}}" aria-labelledby="lbl-heal" onClick="{{toggleHeal}}" class="cf-sec" style="width: 48px; height: 28px; border-radius: 999px; border: 1px solid #3A4553; padding: 2px; cursor: pointer; display: flex; justify-content: {{healKnob}}; background: {{healBg}}"><span style="width: 22px; height: 22px; border-radius: 50%; background: {{healKnobBg}}"></span></button></div>
<p style="margin: 0; font-size: 14px; line-height: 1.55; color: #C3CCD6">In the proposed workflow, extraction errors are checked against a threshold. Suggested template changes should be reviewed before activation.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 1px solid #232B35; border-left: 1px solid #232B35">
<div style="padding: 12px 12px; border-right: 1px solid #232B35; border-bottom: 1px solid #232B35; font-size: 14px"><div style="font-size: 13px; font-weight: 700; margin-bottom: 4px">Now (v1.4.2)</div>Empty fields 8.7%<br>Bad format 3.2%<br>Confidence 0.76<div style="margin-top: 8px; font-size: 16px; font-weight: 600; color: #FF6B5E">Errors 11.9%</div></div>
<div style="padding: 12px 12px; border-right: 1px solid #232B35; border-bottom: 1px solid #232B35; font-size: 14px; background: #2E1715"><div style="font-size: 13px; font-weight: 700; margin-bottom: 4px">Check</div><strong style="font-size: 16px; font-weight: 600; color: #FF6B5E">Above 10%</strong><div style="margin-top: 4px; line-height: 1.45">so an example fix is shown</div></div>
<div style="padding: 12px 12px; border-right: 1px solid #232B35; border-bottom: 1px solid #232B35; font-size: 14px"><div style="font-size: 13px; font-weight: 700; margin-bottom: 4px">Proposed v1.4.3</div>Errors 11.9% → <strong style="color: #3DD68C">4.1%</strong><br>Confidence <strong style="color: #3DD68C">0.93</strong><div style="margin-top: 8px"><button type="button" disabled="{{true}}" title="Not available yet: self-healing is under review" class="cf-ghost" style="padding: 0; border: 0; background: none; color: #9AA6B4; font-size: 14px; font-weight: 600; cursor: not-allowed">View diff (not available yet)</button></div></div>
