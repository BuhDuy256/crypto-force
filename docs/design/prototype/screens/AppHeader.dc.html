<x-dc>
<helmet>
<style id="cf-audit-layout-fixes">
/* Kept inline on purpose: dc-runtime de-duplicates <link> stylesheets across components,
   so linking styles/layout-audit.css here would drop this second copy. It must be
   injected after the screen's base.css so the header breakpoints keep winning. */

/* === Crypto Force layout audit: shared safety and responsive design === */
html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
body {max-width:100%; overflow-x:clip;}
main {box-sizing:border-box; min-width:0;}
main :is(section,aside,article,form,nav) {min-width:0;box-sizing:border-box;}
main :is(img,svg) {max-width:100%;}
main :is(input,select,textarea) {max-width:100%;box-sizing:border-box;}
main :is(p,h1,h2,h3) {overflow-wrap:break-word;}
main :is(table,pre,code) {max-width:100%;}
main pre {overflow-x:auto;white-space:pre;}
main [style*="overflow-x: auto"] {max-width:100%;scrollbar-width:thin;}
/* Imported AppHeader has its own markup; apply breakpoints in every screen. */
@media(min-width:1101px) and (max-width:1380px){
 header nav.cf-wide a {padding-left:9px !important;padding-right:9px !important;font-size:14px !important;white-space:nowrap;}
 header span.cf-wide[role="status"]{display:none !important;}
 header button.cf-wide[aria-haspopup="dialog"]{display:none !important;}
 header button.cf-narrow[aria-label="Search"]{display:flex !important;}
 header div.cf-wide button[aria-haspopup="menu"] > span:nth-of-type(2){display:none !important;}
}
@media(max-width:1100px){
 .cf-wide{display:none !important;}
 .cf-narrow{display:flex !important;}
 header > div:first-child{gap:12px !important;padding-inline:16px !important;}
}
@media(max-width:900px){
 main.cf-audited-main {padding:24px 20px 40px !important;gap:20px !important;}
 main.cf-audited-main h1 {font-size:clamp(26px,4vw,32px) !important;line-height:1.18 !important;}
}
@media(max-width:600px){
 main.cf-audited-main {padding:20px 16px 36px !important;gap:16px !important;}
 main.cf-audited-main section[style*="padding: 16px 20px"] {padding:16px !important;}
 main.cf-audited-main section[style*="padding: 20px 24px"] {padding:16px !important;}
 main.cf-audited-main [role="tablist"] {max-width:100%;overflow-x:auto;scrollbar-width:thin;}
 main.cf-audited-main button {max-width:100%;}
}


/* Header breakpoints: full / compressed / compact navigation. */
.cf-app-header > div:first-child {min-width:0;box-sizing:border-box;}
.cf-app-header nav.cf-wide a {white-space:nowrap;}
@media(min-width:1101px) and (max-width:1380px){
 .cf-app-header > div:first-child {gap:0 12px !important;padding:0 20px !important;}
 .cf-app-header nav.cf-wide a {padding-left:9px !important;padding-right:9px !important;font-size:14px !important;}
 .cf-app-header span.cf-wide[role="status"] {display:none !important;}
 .cf-app-header button.cf-wide[aria-haspopup="dialog"] {display:none !important;}
 .cf-app-header button.cf-narrow[aria-label="Search"] {display:flex !important;}
 .cf-app-header .cf-wide button[aria-haspopup="menu"]>span:nth-of-type(2) {display:none !important;}
 .cf-app-header .cf-wide button[aria-haspopup="menu"]{padding-right:4px !important;gap:6px !important;}
}
@media(max-width:1100px){
 .cf-app-header .cf-wide{display:none !important;}
 .cf-app-header .cf-narrow{display:flex !important;}
 .cf-app-header > div:first-child {padding:0 16px !important;gap:12px !important;min-height:60px !important;}
 .cf-app-header a[href="Main.dc.html"] {font-size:18px !important;}
 .cf-app-header [role="dialog"] {max-width:calc(100vw - 24px) !important;}
}
/* Session gate: full-viewport interstitial shown on workspace screens when signed out. */
.cf-app-header .cf-gate a.cf-gate-home{font-size:14px !important;}
@media(max-width:420px){
 .cf-app-header > div:first-child {padding:0 12px !important;gap:8px !important;}
 .cf-app-header [aria-label="Notifications"]{width:40px !important;}
}

</style>
<link href="../assets/fonts/fonts.css" rel="stylesheet">
<style>
body{margin:0}
/* The header is also opened on its own, without base.css: keep the skip link hidden until focused. */
.cf-app-header .cf-skip{position:absolute;left:12px;top:-60px;z-index:50;padding:10px 14px;border-radius:8px;background:#E7ECF2;color:#0B0E12;font-weight:650;text-decoration:none}
.cf-app-header .cf-skip:focus{top:12px}
</style>
</helmet>

</sc-for>
</nav>

<sc-if value="{{notifOpen}}" hint-placeholder-val="{{false}}">
<button type="button" tabindex="-1" aria-hidden="true" onClick="{{closeAll}}" class="cf-ghost" style="position: fixed; inset: 0; z-index: 0; border: 0; padding: 0; margin: 0; background: transparent; cursor: default"></button>
<section role="dialog" aria-label="Notifications" tabindex="-1" ref="{{setNotifPanel}}" style="z-index: 1; position: absolute; right: -60px; top: 52px; width: 380px; max-width: calc(100vw - 32px); background: #12171E; border: 1px solid #2F3945; border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,0.45); overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #232B35"><h2 style="margin: 0; font-size: 15px; font-weight: 600">Notifications</h2>

</sc-if>
<a href="Settings.dc.html" onClick="{{toNotifSettings}}" class="cf-ghost" style="display: block; padding: 12px 16px; font-size: 13px; font-weight: 600">Notification settings</a>
</section>

<a role="menuitem" tabindex="-1" href="Settings.dc.html" class="cf-ghost" style="display: flex; align-items: center; gap: 12px; min-height: 40px; padding: 0 12px; border-radius: 8px; color: #E7ECF2; text-decoration: none; font-size: 14px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"></path></svg>Settings</a>

</div>
<sc-if value="{{hasResults}}" hint-placeholder-val="{{true}}">

      undoClear: !!st.undoClear && st.notes.length === 0,
      restore: function () { self.setState({ notes: self._cleared || [], undoClear: false }); },
      notes: st.notes.map(function (n) { return Object.assign({}, n, { bg: n.unread ? '#151C26' : 'transparent', dot: n.unread ? '#7AA2FF' : 'transparent', read: function () { if (n.run) self.keep('runOpen', n.run); if (n.panel) self.keep('newsPanel', n.panel); self.setState({ notes: self.state.notes.map(function (x) { return x.id === n.id ? Object.assign({}, x, { unread: false }) : x; }) }); } }); })
    };
  }
}
</script>
