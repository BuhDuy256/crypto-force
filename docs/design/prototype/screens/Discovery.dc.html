<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discovery – Crypto Force</title>
<link rel="preload" href="../assets/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<script src="../vendor/react/react.production.min.js"></script>
<script src="../vendor/react/react-dom.production.min.js"></script>
<script src="../tools/dc-source.js"></script>
<script src="../vendor/dc-runtime/support.js"></script>

</head>
<body>
<script type="text/x-template" data-dc-template>
<x-dc>
<helmet>
<link rel="stylesheet" href="../styles/layout-audit.css">
<style id="cf-audit-layout-fixes">
/* Discovery: task-oriented experiment workspace, no page-level stepper. */
/* Discovery, regrouped by the run loop: configure → watch the run → rank results → combine.
   Config and activity are full-width rows (each can grow; nothing sits beside them to invert).
   Leaderboard + composite builder travel together: composite consumes leaderboard candidates.
   Both align to start; the builder is sticky so it follows the table instead of being stretched. */
.cf-discovery-flow{display:flex !important;flex-direction:column !important;gap:18px !important;align-items:stretch !important;}
.cf-discovery-flow > .cf-results{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(340px,1fr);gap:18px;align-items:start;}
.cf-discovery-flow > .cf-results > section[aria-labelledby="d-comp"]{position:sticky;top:16px;}
.cf-discovery-flow section{min-width:0;width:100%;border-color:#354253 !important;}
.cf-discovery-flow [style*="overflow-x: auto"]{max-width:100%;}
.cf-discovery-flow .cf-config-title{margin:0;font-size:18px;font-weight:650;}
.cf-discovery-flow .cf-muted-explainer{margin:0;color:#9AA6B4;font-size:13px;line-height:1.5;}
.cf-discovery-flow .cf-pipeline-description{border:1px solid #334155;border-radius:8px;background:#111923;padding:10px 12px;font-size:13px;color:#AABBD0;line-height:1.55;}
.cf-discovery-flow .cf-activity-empty{padding:20px;border:1px dashed #38485A;border-radius:9px;background:#0E141B;display:flex;flex-direction:column;gap:7px;}
.cf-discovery-flow .cf-activity-empty strong{font-size:15px;}
.cf-discovery-flow .cf-activity-empty span{font-size:13px;color:#9AA6B4;line-height:1.5;}
@media(max-width:1080px){.cf-discovery-flow{gap:16px !important;}.cf-discovery-flow > .cf-results{grid-template-columns:minmax(0,1fr);gap:16px;}.cf-discovery-flow > .cf-results > section[aria-labelledby="d-comp"]{position:static;}}
@media(max-width:600px){.cf-discovery-flow section{padding:16px !important;}}
</style>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../styles/base.css">
</helmet>
<div style="min-height: 100vh; background: #0B0E12; color: #E7ECF2; font-family: Onest, system-ui, sans-serif; font-variant-numeric: tabular-nums lining-nums">
<div style="position: sticky; top: 0; z-index: 30"><dc-import name="AppHeader" active="di" hint-size="100%,61px"></dc-import></div>
<main class="cf-audited-main cf-discovery-layout" style="max-width: 1640px; margin: 0 auto; padding: 24px 28px 40px; display: flex; flex-direction: column; gap: 24px">
<div role="note" style="border:1px solid #334155;border-radius:7px;padding:8px 12px;background:#111923;color:#AFC2D6;font-size:12px;line-height:1.4;max-width:100%;box-sizing:border-box">UI prototype: prices, backtests, news, account state and workflow feedback are illustrative. No live market, AI or account service is connected in this HTML file.</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -0.03em">Discovery</h1>
<p style="margin: 0; font-size: 15px; color: #9AA6B4">Combine strategy signals, configure a search, and compare candidate results using consistent metrics.</p>
</div>

<div class="cf-discovery-flow" style="display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start">
<section aria-labelledby="d-config" style="background:#12171E;border:1px solid #252D38;border-radius:12px;padding:16px 20px;display:flex;flex-direction:column;gap:14px">
<h2 id="d-config" class="cf-config-title">Search configuration</h2>
<p class="cf-muted-explainer">Set your search method and limits. You can update these between runs.</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-top: 12px; border-top: 1px solid #232B35">
<span style="flex: 1 1 260px; font-size: 14px; color: #C3CCD6">{{settingsSummary}}</span>
<button type="button" onClick="{{toggleSettings}}" aria-expanded="{{settingsOpen}}" aria-controls="d-settings" class="cf-sec" style="display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border: 1px solid #3A4553; border-radius: 8px; background: none; color: #E7ECF2; font-size: 14px; font-weight: 600; cursor: pointer">Search settings<svg style="transform: {{settingsRot}}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
</div>
<sc-if value="{{settingsOpen}}" hint-placeholder-val="{{false}}">
<div id="d-settings">
<sc-if value="{{locked}}" hint-placeholder-val="{{false}}"><p role="note" style="margin: 0 0 12px; font-size: 13px; line-height: 1.5; color: #F2D28B">Settings are locked while this search is in progress. Stop it to change them.</p></sc-if>
<fieldset disabled="{{locked}}" style="margin: 0; padding: 0; border: 0; min-width: 0">
<div style="display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: flex-end">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 700">Search method</legend>
<div style="display: flex; flex-wrap: wrap; gap: 4px 16px">
<sc-for list="{{methods}}" as="m" hint-placeholder-count="3"><label title="{{m.desc}}" style="display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 14px; cursor: pointer"><input type="radio" name="method" checked="{{m.on}}" onChange="{{m.pick}}" style="width: 17px; height: 17px; margin: 0">{{m.name}}</label></sc-for>
</div>
<span style="font-size: 13px; color: #9AA6B4">{{methodDesc}}</span>
</fieldset>
<fieldset style="margin: 0; padding: 0; border: 0; min-width: 0; flex: 1 1 100%; display: flex; flex-direction: column; gap: 6px">
<legend style="padding: 0; margin-bottom: 6px; font-size: 13px; font-weight: 700">Stop when any of these is reached</legend>
<sc-for list="{{limits}}" as="l" hint-placeholder-count="3">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px">
<label style="display: flex; align-items: center; gap: 8px; min-height: 40px; flex: 0 1 280px; font-size: 14px; cursor: pointer"><input type="checkbox" checked="{{l.on}}" onChange="{{l.toggle}}" style="width: 17px; height: 17px; margin: 0">{{l.label}}</label>
<input type="number" aria-label="{{l.aria}}" min="{{l.min}}" max="{{l.max}}" step="{{l.step}}" value="{{l.val}}" onChange="{{l.set}}" disabled="{{l.off}}" aria-invalid="{{l.inv}}" style="width: 110px; height: 40px; padding: 0 12px; border: 1px solid {{l.bd}}; border-radius: 8px; background: #0F141A; font-size: 14px">
<span style="font-size: 13px; color: #9AA6B4">{{l.unit}}</span>
<sc-if value="{{l.err}}" hint-placeholder-val="{{false}}"><span style="flex-basis: 100%; font-size: 13px; color: #FF6B5E">{{l.err}}</span></sc-if>
</div>
</sc-for>
<sc-if value="{{limitsErr}}" hint-placeholder-val="{{false}}"><span role="alert" style="font-size: 13px; color: #FF6B5E">{{limitsErr}}</span></sc-if>
</fieldset>
</div>
</fieldset>
</div>
</sc-if>
</section>
<section aria-labelledby="d-search" style="background: #12171E; border: 1px solid #252D38; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px">
<h2 id="d-search" style="margin:0;font-size:18px;font-weight:650">Search activity</h2>
<span role="status" style="display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px; border: 1.5px solid {{statusColor}}; color: {{statusColor}}; font-size: 13px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{statusColor}}"></span>{{statusLabel}}</span>
<div style="margin-left: auto; display: flex; gap: 8px">
<sc-if value="{{canStart}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{start}}" class="cf-pri" style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: #E7ECF2; color: #0B0E12; font-size: 14px; font-weight: 700; cursor: pointer">{{startLabel}}</button></sc-if>
<sc-if value="{{canPause}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{pause}}" class="cf-sec" style="min-height: 40px; padding: 0 16px; border: 1px solid #3A4553; border-radius: 8px; background: none; font-size: 14px; font-weight: 700; cursor: pointer">Pause</button></sc-if>
<sc-if value="{{canStop}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{stop}}" class="cf-sec" style="min-height: 40px; padding: 0 16px; border: 1px solid #333D4A; border-radius: 8px; background: none; font-size: 14px; font-weight: 600; cursor: pointer">Stop</button></sc-if>
</div>
</div>
<div class="cf-pipeline-description"><strong style="color:#DEE6F2">Search process</strong> · Generate candidates → Backtest → Evaluate → Rank. This repeats during a run; it is not a set of tasks you must complete manually.</div>
<sc-if value="{{showActivitySample}}" hint-placeholder-val="{{false}}">
<sc-if value="{{endBanner}}" hint-placeholder-val="{{false}}"><div role="status" style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px 16px; border: 1px solid {{endBd}}; border-radius: 10px; background: {{endBg}}; font-size: 14px; line-height: 1.5"><span style="flex: 1 1 300px"><strong style="font-weight: 650">{{endTitle}}</strong> {{endText}}</span><sc-if value="{{isFailed}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{retry}}" class="cf-pri" style="min-height: 40px; padding: 0 16px; border: 0; border-radius: 8px; background: #E7ECF2; color: #0B0E12; font-size: 14px; font-weight: 700; cursor: pointer">Retry with the same settings</button></sc-if></div></sc-if>
<p class="cf-muted-explainer">Simulated search: one second here stands for one minute of search time. Figures are illustrative; no optimizer is connected.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); border-top: 1px solid #232B35; border-left: 1px solid #232B35">
<sc-for list="{{meters}}" as="m" hint-placeholder-count="4"><div style="min-width: 0; padding: 12px 16px; border-right: 1px solid #232B35; border-bottom: 1px solid #232B35"><div style="font-size: 13px; color: #9AA6B4">{{m.label}}</div><div style="font-size: 24px; font-weight: 600">{{m.value}} <span style="font-size: 15px; font-weight: 400; color: #9AA6B4">{{m.of}}</span></div><div style="font-size: 13px; color: #9AA6B4">{{m.sub}}</div><sc-if value="{{m.hasBar}}" hint-placeholder-val="{{true}}"><div role="progressbar" aria-label="{{m.label}}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{m.pct}}" style="height: 6px; background: #232B35; margin-top: 8px"><div style="width: {{m.pctW}}; height: 100%; background: {{m.barC}}"></div></div></sc-if></div></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; border: 1px solid #232B35; border-radius: 10px"><div style="font-size: 13px; color: #9AA6B4">Best so far</div><div style="font-size: 17px; font-weight: 600; overflow-wrap: anywhere">{{best.name}}</div><div style="font-size: 14px">Score <strong>{{best.score}}</strong> · <span style="color: #3DD68C; font-weight: 700">{{best.ret}}</span> · <span style="color: #FF6B5E">MDD {{best.mdd}}</span></div><div style="font-size: 12px; line-height: 1.4; color: #F2B544">Re-test on independent data before drawing conclusions.</div></div>
</sc-if><sc-if value="{{showActivityEmpty}}" hint-placeholder-val="{{true}}"><div class="cf-activity-empty" role="status"><strong>No search started</strong><span>Check the stop conditions above, then select Start search. The search ends on its own at the first condition it reaches; you can pause, resume or stop it at any time.</span></div></sc-if>

</section>
<div class="cf-results">
<section aria-labelledby="d-lb" style="background: #12171E; border: 1px solid #252D38; border-radius: 12px; padding: 16px 20px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px"><h2 id="d-lb" style="margin:0;font-size:18px;font-weight:650">Leaderboard</h2><span style="font-size: 13px; color: #9AA6B4">Illustrative candidate results · BTCUSDT 15m · 01/05–15/05/2025 · not produced by this demo search</span>
<label style="margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700">Keep top <select style="height: 36px; padding: 0 8px; border: 1px solid #3A4553; border-radius: 8px; background: #0F141A; font-size: 13px"><option>3</option><option>5</option><option>10</option></select></label></div>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 640px; border-collapse: collapse; font-size: 15px; margin-top: 8px">
<thead><tr style="border-bottom: 1px solid #2F3945; font-size: 13px; color: #9AA6B4; text-align: right">
<th style="text-align: left; font-weight: 600; padding: 8px 0; width: 44px">#</th><th style="text-align: left; font-weight: 600">Strategy</th>
<sc-for list="{{sorts}}" as="s" hint-placeholder-count="4"><th aria-sort="{{s.aria}}" style="font-weight: 600"><button type="button" onClick="{{s.pick}}" class="cf-ghost" style="display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0; border: 0; background: none; cursor: pointer; font-size: 13px; font-weight: {{s.w}}; color: {{s.c}}">{{s.label}}<sc-if value="{{s.on}}" hint-placeholder-val="{{false}}"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M5 9L.5 2h9z" fill="currentColor"></path></svg></sc-if></button></th></sc-for>
<th style="font-weight: 600; text-align: right">Trades</th><th style="font-weight: 600; text-align: center; width: 24%">Return vs. max drawdown</th><th style="width: 140px"><span style="position: absolute; left: -9999px">Actions</span></th></tr></thead>
<tbody>
<sc-for list="{{board}}" as="r" hint-placeholder-count="3">
<tr style="border-bottom: 1px solid #232B35">
<td style="padding: 12px 0; font-weight: 600">{{r.rank}}</td>
<td style="font-weight: 700">{{r.name}}</td>
<td style="text-align: right; color: #3DD68C; font-weight: 700">{{r.retTxt}}</td>
<td style="text-align: right">{{r.winTxt}}</td>
<td style="text-align: right; color: #FF6B5E">{{r.mddTxt}}</td>
<td style="text-align: right">{{r.scoreTxt}}</td>
<td style="text-align: right; color: {{r.tradesC}}">{{r.trades}}</td>
<td style="padding-left: 20px"><div role="img" aria-label="{{r.aria}}" style="position: relative; height: 16px"><span style="position: absolute; left: 0; right: 0; top: 7px; border-top: 1px solid #333D4A"></span><span style="position: absolute; left: {{r.zero}}; top: 0; height: 16px; border-left: 1px solid #2F3945"></span><span style="position: absolute; top: 5px; height: 5px; left: {{r.negL}}; width: {{r.negW}}; background: #FF6B5E"></span><span style="position: absolute; top: 5px; height: 5px; left: {{r.posL}}; width: {{r.posW}}; background: #3DD68C"></span></div></td>
<td style="text-align: right; white-space: nowrap"><a href="Backtest.dc.html" onClick="{{r.open}}" class="cf-ghost" style="display: inline-flex; align-items: center; min-height: 36px; padding: 0 8px; font-size: 13px; font-weight: 600">Re-test</a></td>
</tr>
</sc-for>
</tbody>
</table>
</div>
<p style="margin: 8px 0 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; font-size: 13px; color: #9AA6B4"><span>Click a column to rank by it. The example score combines return, max drawdown and win rate. Final calculation and weights must be verified against the search engine.</span><span class="cf-tip">Max DD<button type="button" class="cf-tipbtn" aria-label="What is Max DD?" aria-describedby="tip7"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg></button><span role="tooltip" id="tip7" class="cf-tipbox">Max drawdown: the largest drop from a peak to a later low during the test, as a percent of the account.</span></span><span class="cf-tip">Score<button type="button" class="cf-tipbtn" aria-label="What is Score?" aria-describedby="tip8"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg></button><span role="tooltip" id="tip8" class="cf-tipbox">Combined rank from return, win rate and max drawdown. Higher is better.</span></span></p>
</section>
<section aria-labelledby="d-comp" style="background: #12171E; border: 1px solid #252D38; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 16px">
<h2 id="d-comp" style="margin:0;font-size:18px;font-weight:650">Composite builder</h2><p class="cf-muted-explainer">Combine signal sources and adjust how they contribute to a candidate strategy.</p>
<sc-if value="{{draftNote}}" hint-placeholder-val="{{false}}"><div role="status" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #5A4520; border-radius: 10px; background: #1F1A10; font-size: 14px; line-height: 1.5; color: #F2D28B"><span>{{draftNote}} Drafts are kept in this browser until you save or discard them.</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" onClick="{{discardDraft}}" class="cf-sec" style="min-height: 40px; padding: 0 14px; border: 1px solid #5A4520; border-radius: 8px; background: none; color: #F2D28B; font-size: 14px; font-weight: 600; cursor: pointer">Discard draft</button><button type="button" onClick="{{keepDraft}}" class="cf-ghost" style="min-height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: #E7ECF2; font-size: 14px; font-weight: 600; cursor: pointer">Keep</button></div></div></sc-if>
<sc-if value="{{editing}}" hint-placeholder-val="{{false}}"><div role="status" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border: 1px solid #2F4A7A; border-radius: 10px; background: #121C2E; font-size: 14px; line-height: 1.5"><span><strong style="font-weight: 650">Editing {{editName}}</strong> · v{{editVer}}. Saving updates this composite in your library. Past backtest runs keep the configuration they ran with.</span><sc-if value="{{editClean}}" hint-placeholder-val="{{true}}"><a href="Library.dc.html" onClick="{{cancelEdit}}" style="align-self: flex-start; display: inline-flex; align-items: center; min-height: 36px; font-size: 14px; font-weight: 600">Stop editing</a></sc-if><sc-if value="{{editDirty}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{askStopEdit}}" class="cf-ghost" style="align-self: flex-start; min-height: 36px; padding: 0; border: 0; background: none; color: #7AA2FF; font-size: 14px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer">Stop editing</button></sc-if></div></sc-if>
<fieldset style="margin: 0; padding: 0; border: 0">
<legend style="padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 700">Building blocks</legend>
<div style="display: flex; flex-direction: column; border-top: 1px solid #232B35">
<sc-for list="{{singles}}" as="s" hint-placeholder-count="6">
<label style="display: flex; align-items: flex-start; gap: 12px; padding: 8px 0; border-bottom: 1px solid #232B35; cursor: pointer"><input type="checkbox" checked="{{s.on}}" onChange="{{s.toggle}}" style="width: 17px; height: 17px; margin: 2px 0 0"><span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 14px; font-weight: 700">{{s.name}}</strong><span style="font-size: 13px; color: #9AA6B4; line-height: 1.4">{{s.desc}}</span></span></label>
</sc-for>
</div>
</fieldset>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span style="font-size: 13px; font-weight: 700">Quick picks</span>
<sc-for list="{{combos}}" as="c" hint-placeholder-count="3"><button type="button" onClick="{{c.pick}}" class="cf-sec" style="min-height: 36px; padding: 0 12px; border: 1px solid #333D4A; border-radius: 999px; background: #151A21; font-size: 13px; cursor: pointer">{{c.label}}</button></sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px"><span id="lbl-vote" style="font-size: 13px; font-weight: 700">Combine signals by</span>
<div role="group" aria-labelledby="lbl-vote" style="display: flex; border: 1px solid #3A4553; border-radius: 8px; overflow: hidden; align-self: flex-start">
<sc-for list="{{votes}}" as="v" hint-placeholder-count="2"><button type="button" onClick="{{v.pick}}" aria-pressed="{{v.on}}" class="cf-ghost" style="min-height: 38px; padding: 0 16px; border: 0; font-size: 14px; font-weight: 600; cursor: pointer; background: {{v.bg}}; color: {{v.fg}}">{{v.label}}</button></sc-for>
</div></div>
<sc-if value="{{isWeighted}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{toggleWeights}}" aria-expanded="{{weightsOpen}}" aria-controls="d-weights" class="cf-sec" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px; border: 1px solid #3A4553; border-radius: 8px; background: none; color: #E7ECF2; font-size: 14px; font-weight: 600; cursor: pointer">{{weightsLabel}}<svg style="transform: {{weightsRot}}" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<sc-if value="{{weightsOpen}}" hint-placeholder-val="{{false}}">
<table id="d-weights" style="width: 100%; border-collapse: collapse; font-size: 14px">
<thead><tr style="border-bottom: 1px solid #2F3945; font-size: 13px; color: #9AA6B4; text-align: left"><th style="font-weight: 600; padding: 8px 0">Indicator</th><th style="font-weight: 600">Weight</th><th style="font-weight: 600; text-align: right">Signal</th></tr></thead>
<tbody>
<sc-for list="{{weights}}" as="w" hint-placeholder-count="3">
<tr style="border-bottom: 1px solid #232B35"><td style="padding: 8px 0; font-weight: 600">{{w.label}}</td>
<td><span style="display: flex; align-items: center; gap: 12px"><input type="range" min="0" max="1" step="0.05" value="{{w.val}}" onChange="{{w.change}}" aria-label="Weight for {{w.label}}" style="flex: 1; min-width: 80px"><span style="width: 36px; text-align: right; font-weight: 700">{{w.txt}}</span></span></td>
<td style="text-align: right; font-weight: 700; color: {{w.sc}}">{{w.sig}}</td></tr>
</sc-for>
</tbody>
</table>
</sc-if>
</sc-if>

      statusLabel: STATUS[s][0], statusColor: STATUS[s][1], showActivitySample: s !== 'idle', showActivityEmpty: s === 'idle',

      locked: s === 'running' || s === 'paused',
      meters: meters, best: met ? { name: met.best[0], score: met.best[1].toFixed(2), ret: met.best[2], mdd: met.best[3] } : { name: '', score: '', ret: '', mdd: '' },
      endBanner: ended, isFailed: s === 'failed',
      endTitle: s === 'completed' ? 'Completed.' : (s === 'stopped' ? 'Stopped by you.' : (s === 'failed' ? 'Search failed.' : '')),
      endText: !ses ? '' : (s === 'completed' ? ses.reason + ' The leaderboard keeps the best candidates it found.' : (s === 'stopped' ? 'The ' + (ses.evaluated || 0).toLocaleString('en-US') + ' candidates evaluated before you stopped are kept in the leaderboard.' : (s === 'failed' ? ses.reason + ' Results found before the failure are kept.' : ''))),
      endBd: s === 'failed' ? '#5A2A2A' : (s === 'completed' ? '#2F4A7A' : '#3A4553'), endBg: s === 'failed' ? '#1A1315' : (s === 'completed' ? '#121C2E' : '#151A21'),
      retry: function () { self.setState({ ses: null }); setTimeout(function () { self._dsStart(false); }, 0); },
      start: function () { self._dsStart(s === 'paused'); },
      limits: [['cand', 'Candidates evaluated', 'Candidate limit', st.cand, 'candidates', 10, 10000, 10, 'cand'], ['time', 'Search time', 'Time limit in minutes', st.timeVal, 'minutes', 1, 1440, 1, 'timeVal'], ['stale', 'Rounds without a better candidate', 'Rounds without improvement', st.staleVal, 'rounds in a row', 1, 500, 1, 'staleVal']].map(function (x) {
        var on = !!st.lim[x[0]], err = lerr[x[0]] || '';
        return { label: x[1], aria: x[2], val: x[3], unit: x[4], min: x[5], max: x[6], step: x[7], on: on, off: !on, err: err, inv: err ? 'true' : 'false', bd: err ? '#FF6B5E' : '#3A4553',
          toggle: function () { var l = Object.assign({}, self.state.lim); l[x[0]] = !l[x[0]]; self.setState({ lim: l }); },
          set: function (e) { var o = {}; o[x[8]] = e.target.value; self.setState(o); } };
      }),
      limitsErr: lerr.none || '',

      settingsSummary: (function () { var parts = []; if (st.lim.cand) parts.push(st.cand + ' candidates'); if (st.lim.time) parts.push(st.timeVal + ' min'); if (st.lim.stale) parts.push(st.staleVal + ' rounds without improvement'); return ['Random', 'Domain-guided', 'Genetic'][st.method] + ' search · ' + (parts.length ? 'stops at ' + parts.join(', or ') : 'no stop condition set'); })(),

      },
      pause: function () { var cur = self.state.ses; if (!cur || cur.status !== 'running') return; var now = Date.now(), m = self.dsMetrics(cur, now), p = Object.assign({}, cur, { status: 'paused', elapsedBefore: self.dsElapsed(cur, now), startedAt: null }); self.dsSave(p); self.setState({ ses: p }); self.toast('Search paused at ' + m.ev.toLocaleString('en-US') + ' candidates. Resume continues the same session.'); },
      stop: function () { var cur = self.state.ses; if (!cur) return; var now = Date.now(), m = self.dsMetrics(cur, now), p = Object.assign({}, cur, { status: 'stopped', elapsedBefore: m.el, startedAt: null, endedAt: now, evaluated: m.ev, reason: 'Stopped by you.' }); self.dsSave(p); self.setState({ ses: p }); self.toast('Search stopped. The ' + m.ev.toLocaleString('en-US') + ' candidates evaluated so far are kept.'); },

      board: board,
      singles: singles.map(function (x) { var on = st.picked.indexOf(x[0]) >= 0; return { name: x[0], desc: x[1], on: on, toggle: function () { var p = self.state.picked.slice(), i = p.indexOf(x[0]); if (i >= 0) p.splice(i, 1); else p.push(x[0]); self.setState({ picked: p }); } }; }),

    };
  }

  toast(text, kind, opts) {
    var self = this; opts = opts || {};
    this._undoFn = opts.undo || null; this._goFn = opts.go || null;
    this.setState({ toast: { text: text, kind: kind || 'ok', link: opts.link || '', href: opts.href || '', undo: !!opts.undo } });
    clearTimeout(this._tt);
    this._tt = setTimeout(function () { self.setState({ toast: null }); }, opts.undo ? 8000 : 5000);
  }
  store(key, val) { try { if (val === undefined) { var v = window.localStorage.getItem('cf.' + key); return v ? JSON.parse(v) : null; } window.localStorage.setItem('cf.' + key, JSON.stringify(val)); } catch (e) { return null; } return val; }
  unstore(key) { try { window.localStorage.removeItem('cf.' + key); } catch (e) {} }
  actionVals() {
    var self = this, cfg = this.actionsCfg ? this.actionsCfg() : {}, st = this.state.act || {}, out = {};
    Object.keys(cfg).forEach(function (k) {
      var c = cfg[k], busy = st[k] === 'busy';
      out[k] = { busy: busy, idle: !busy, label: busy ? c.busy : c.idle, run: function () {

    return { act: out, toastShow: !!t, toastText: t ? t.text : '', toastErr: !!(t && t.kind === 'error'), toastOk: !!(t && t.kind !== 'error'),
      toastBd: t && t.kind === 'error' ? '#5A2A2A' : '#1F6B47', toastHasLink: !!(t && t.href), toastLink: t ? t.link : '', toastHref: t ? t.href : '#', toastGo: function () { var f = self._goFn; if (f) f(); },
      toastHasUndo: !!(t && t.undo), toastUndo: function () { var f = self._undoFn; self._undoFn = null; self.setState({ toast: null }); if (f) f(); },
      toastDismiss: function () { self.setState({ toast: null }); } };
  }

}
