<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:3700}}">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { idea: '', menu: false, faq: 0, flash: '' };
    try { var fl = window.localStorage.getItem('cf.flash'); if (fl) { this.state.flash = JSON.parse(fl); window.localStorage.removeItem('cf.flash'); } } catch (e) {}
  }
  renderVals() {
    var self = this, signedIn = true;
    try { var sv = JSON.parse(window.localStorage.getItem('cf.session') || 'null'); signedIn = !(sv && sv.state === 'out'); } catch (e) {}
    function pct(v, lo, hi) { return (v - lo) / (hi - lo) * 100; }
    function bar(name, ret, win, mdd) {
      var lo = -10, hi = 30, z = pct(0, lo, hi), n = pct(mdd, lo, hi), p = pct(ret, lo, hi);
      return {
        name: name, ret: '+' + ret.toFixed(1) + '%', win: win + '%', mdd: '−' + Math.abs(mdd).toFixed(1) + '%',
        zero: z + '%', negL: n + '%', negW: (z - n) + '%', posL: z + '%', posW: (p - z) + '%',
        aria: 'Worst drop ' + mdd + '%, return ' + ret + '%'
      };
    }
    var ex = ['MA20 crosses above MA50', 'RSI below 30 and price under lower Bollinger Band', 'Majority vote of MA, RSI and support/resistance'];
    return {
      menuOpen: this.state.menu, menuClosed: !this.state.menu, menuLabel: this.state.menu ? 'Close menu' : 'Open menu',
      toggleMenu: function () { self.setState({ menu: !self.state.menu }); },
      closeMenu: function () { self.setState({ menu: false }); },
      setMenuBtn: function (el) { self._menuBtn = el; },
      drawerKey: function (e) { if (e.key === 'Escape') { self.setState({ menu: false }); if (self._menuBtn) self._menuBtn.focus(); } },
      ideaHref: signedIn ? 'Strategy.dc.html' : 'Auth.dc.html',
      signedIn: signedIn, signedOut: !signedIn, flash: self.state.flash, dismissFlash: function () { self.setState({ flash: '' }); },
      keepIdea: function () { var t = (self.state.idea || '').trim(); try { if (t) window.localStorage.setItem('cf.idea', JSON.stringify(t)); if (!signedIn) window.localStorage.setItem('cf.next', JSON.stringify({ href: 'Strategy.dc.html', label: 'Strategy Engine', why: t ? 'idea' : 'page' })); } catch (e) {} },
      faq: [
        ['Does Crypto Force place trades on my exchange account?', 'No. It never connects to an exchange account and never asks for API keys. Everything is analysis and simulation on market data.'],
        ['Where does the data come from?', 'Price candles and ticks come from Binance through its public API and WebSocket. News comes from the sources you configure in the News tab.'],
        ['How do I describe a strategy?', 'Describe the entry and exit rules in your own words, for example "buy when RSI is below 30 and price is under the lower Bollinger Band", or paste a link to a write-up. The Strategy Engine turns it into rules you can check before saving.'],
        ['Can I trust a backtest result?', 'A backtest shows how a rule would have traded on past data with the fees and slippage you set. Read the return together with max drawdown and the number of trades; a good past result is not a forecast.'],
        ['Can I reproduce a result later?', 'Reproducibility requires the same strategy version, data, execution assumptions and backtest settings. Compare those details when reviewing a run.']
      ].map(function (x, i) { var open = self.state.faq === i; return { q: x[0], a: x[1], open: open, rot: open ? 'rotate(180deg)' : 'none', toggle: function () { self.setState({ faq: open ? -1 : i }); } }; }),
      idea: this.state.idea,
      setIdea: function (e) { self.setState({ idea: e.target.value }); },
      examples: ex.map(function (t) { return { label: t, use: function () { self.setState({ idea: t }); } }; }),
      listings: [bar('MA + RSI + S/R', 24.2, 62, -7.1), bar('MA + Bollinger', 21.7, 55, -8.4), bar('RSI + S/R', 18.4, 64, -6.7)],
      loop: [
        { name: 'Market', q: 'How has price moved?', a: 'Up to four candlestick charts of one pair, each on its own timeframe, updating live.' },
        { name: 'Strategy', q: 'When do I buy or sell?', a: 'Rules based on indicators (MA, RSI, Bollinger, support/resistance, SMC, Wyckoff), described in natural language or referenced by a link, and combined by majority or weighted vote.' },
        { name: 'Backtest', q: 'How would the rule have traded?', a: 'Every simulated trade over the period you pick, with entries and exits on the chart, fees and slippage included.' },
        { name: 'Evaluation', q: 'Is it good, or just risky?', a: 'Total return, win rate, max drawdown and number of trades, side by side.' },
        { name: 'Leaderboard', q: 'Which one is better?', a: 'Results ranked by return, win rate, drawdown or a combined score, keeping the top few.' },
        { name: 'Discovery', q: 'What should I try next?', a: 'Automatic search that generates, tests and ranks variants until your stop condition, with a status you can pause and resume.' },
        { name: 'News', q: 'What else is going on?', a: 'News per coin, scored positive, neutral or negative, usable as an input only when a rule asks for it.' }
      ]
    };
  }
}
</script>
