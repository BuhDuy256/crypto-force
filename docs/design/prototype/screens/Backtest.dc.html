<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backtest – Crypto Force</title>
<link rel="preload" href="../assets/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<script src="../vendor/react/react.production.min.js"></script>
<script src="../vendor/react/react-dom.production.min.js"></script>
<script src="../tools/dc-source.js"></script>
<script src="../vendor/dc-runtime/support.js"></script>

</head>
<body>
<script type="text/x-template" data-dc-template>
<x-dc>
<helmet>
<link rel="stylesheet" href="../styles/layout-audit.css">
<style id="cf-audit-layout-fixes">
/* Backtest: keep setup, metrics and visuals in reading order; convert trades to cards on phones. */
.cf-backtest-layout > div[style*="flex-wrap: wrap"] {min-width:0;}
.cf-backtest-layout section[aria-labelledby="b-trades"] {min-width:0 !important;}
.cf-backtest-layout section[aria-labelledby="b-trades"] > div[style*="overflow-x: auto"]{min-width:0;width:100%;}
@media(max-width:800px){
 .cf-backtest-layout > div[style*="flex-wrap: wrap"] > section {flex:1 1 100% !important;}
}
@media(max-width:620px){
 .cf-backtest-layout > form [style*="flex-wrap: wrap"] > div {flex:1 1 42% !important;min-width:120px !important;}
 .cf-backtest-layout :is(input,select){min-width:0;}
 .cf-backtest-layout{overflow-x:clip;}
 .cf-backtest-layout section[aria-labelledby="b-trades"] table {min-width:0 !important;width:100% !important;border-collapse:separate !important;border-spacing:0 10px !important;}
 .cf-backtest-layout section[aria-labelledby="b-trades"] thead {display:none !important;}
 .cf-backtest-layout section[aria-labelledby="b-trades"] tbody tr{display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 12px;padding:14px;border:1px solid #303C49 !important;border-radius:10px;background:#151B23;}
 .cf-backtest-layout section[aria-labelledby="b-trades"] tbody td{display:flex !important;flex-direction:column;text-align:left !important;gap:3px;padding:0 !important;overflow-wrap:anywhere;}
 .cf-backtest-layout section[aria-labelledby="b-trades"] tbody td::before{font-size:10px;font-weight:650;letter-spacing:.06em;color:#8F9CAC;text-transform:uppercase;}
 .cf-backtest-layout section[aria-labelledby="b-trades"] tbody td:nth-child(1)::before{content:"Trade";}
 .cf-backtest-layout section[aria-labelledby="b-trades"] tbody td:nth-child(2)::before{content:"Opened";}
 .cf-backtest-layout section[aria-labelledby="b-trades"] tbody td:nth-child(3)::before{content:"Side";}
 .cf-backtest-layout section[aria-labelledby="b-trades"] tbody td:nth-child(4)::before{content:"Entry";}
 .cf-backtest-layout section[aria-labelledby="b-trades"] tbody td:nth-child(5)::before{content:"Stop loss";}
 .cf-backtest-layout section[aria-labelledby="b-trades"] tbody td:nth-child(6)::before{content:"Take profit";}
 .cf-backtest-layout section[aria-labelledby="b-trades"] tbody td:nth-child(7)::before{content:"Exit";}
 .cf-backtest-layout section[aria-labelledby="b-trades"] tbody td:nth-child(8)::before{content:"Fee";}
 .cf-backtest-layout section[aria-labelledby="b-trades"] tbody td:nth-child(9)::before{content:"Slippage";}
 .cf-backtest-layout section[aria-labelledby="b-trades"] tbody td:nth-child(10)::before{content:"Held";}
 .cf-backtest-layout section[aria-labelledby="b-trades"] tbody td:nth-child(11)::before{content:"P/L (USD)";}
 .cf-backtest-layout section[aria-labelledby="b-trades"] tbody td:nth-child(12)::before{content:"P/L %";}
}
</style>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../styles/base.css">
</helmet>
<div style="min-height: 100vh; background: #0B0E12; color: #E7ECF2; font-family: Onest, system-ui, sans-serif; font-variant-numeric: tabular-nums lining-nums">
<div style="position: sticky; top: 0; z-index: 30"><dc-import name="AppHeader" active="bt" hint-size="100%,61px"></dc-import></div>
<main class="cf-audited-main cf-backtest-layout" style="max-width: 1640px; margin: 0 auto; padding: 24px 28px 40px; display: flex; flex-direction: column; gap: 24px">
<div role="note" style="border:1px solid #334155;border-radius:7px;padding:8px 12px;background:#111923;color:#AFC2D6;font-size:12px;line-height:1.4;max-width:100%;box-sizing:border-box">UI prototype: prices, backtests, news, account state and workflow feedback are illustrative. No live market, AI or account service is connected in this HTML file.</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 32px; font-weight: 600; letter-spacing: -0.03em">Backtest</h1>
<p style="margin: 0; font-size: 15px; color: #9AA6B4">Replay a strategy over a past period, with fees and slippage, trade by trade.</p>
</div>
<div role="tablist" aria-label="Backtest views" onKeyDown="{{viewKey}}" style="display: flex; flex-wrap: wrap; border-bottom: 1px solid #2F3945">
<sc-for list="{{views}}" as="t" hint-placeholder-count="2"><button type="button" role="tab" id="{{t.id}}" aria-selected="{{t.on}}" tabindex="{{t.tab}}" onClick="{{t.pick}}" class="cf-ghost" style="min-height: 44px; padding: 0 18px; border: 0; background: none; cursor: pointer; font-size: 15px; margin-bottom: -1px; font-weight: {{t.w}}; color: {{t.c}}; border-bottom: 2px solid {{t.b}}">{{t.label}}</button></sc-for>
</div>

<sc-if value="{{isNew}}" hint-placeholder-val="{{true}}">
<form aria-label="Backtest setup" style="display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #12171E; border: 1px solid #252D38; border-radius: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 16px">
<div style="flex: 1.2 1 130px; display: flex; flex-direction: column; gap: 8px"><label for="b-pair" style="font-size: 13px; font-weight: 700">Pair</label><select id="b-pair" value="{{v.pair}}" onChange="{{on.pair}}" style="height: 42px; padding: 0 12px; border: 1px solid {{e.pair.bd}}; border-radius: 8px; background: #0F141A; color: #E7ECF2; font-size: 15px"><option>BTCUSDT</option><option>ETHUSDT</option><option>SOLUSDT</option></select><sc-if value="{{e.pair.msg}}" hint-placeholder-val="{{false}}"><span id="b-pair-err" style="font-size: 12px; line-height: 1.4; color: #FF6B5E">{{e.pair.msg}}</span></sc-if></div>
<div style="flex: 0.7 1 90px; display: flex; flex-direction: column; gap: 8px"><label for="b-tf" style="font-size: 13px; font-weight: 700">Timeframe</label><select id="b-tf" value="{{v.tf}}" onChange="{{on.tf}}" style="height: 42px; padding: 0 12px; border: 1px solid {{e.tf.bd}}; border-radius: 8px; background: #0F141A; color: #E7ECF2; font-size: 15px"><option>1m</option><option>5m</option><option>15m</option><option>1h</option><option>4h</option></select><sc-if value="{{e.tf.msg}}" hint-placeholder-val="{{false}}"><span id="b-tf-err" style="font-size: 12px; line-height: 1.4; color: #FF6B5E">{{e.tf.msg}}</span></sc-if></div>
<div style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 8px"><label for="b-from" style="font-size: 13px; font-weight: 700">From</label><input id="b-from" type="date" max="{{today}}" value="{{v.from}}" onChange="{{on.from}}" aria-invalid="{{e.from.inv}}" aria-describedby="b-from-err" style="height: 42px; padding: 0 12px; border: 1px solid {{e.from.bd}}; border-radius: 8px; background: #0F141A; color: #E7ECF2; font-size: 15px"><sc-if value="{{e.from.msg}}" hint-placeholder-val="{{false}}"><span id="b-from-err" style="font-size: 12px; line-height: 1.4; color: #FF6B5E">{{e.from.msg}}</span></sc-if></div>
<div style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 8px"><label for="b-to" style="font-size: 13px; font-weight: 700">To</label><input id="b-to" type="date" max="{{today}}" value="{{v.to}}" onChange="{{on.to}}" aria-invalid="{{e.to.inv}}" aria-describedby="b-to-err" style="height: 42px; padding: 0 12px; border: 1px solid {{e.to.bd}}; border-radius: 8px; background: #0F141A; color: #E7ECF2; font-size: 15px"><sc-if value="{{e.to.msg}}" hint-placeholder-val="{{false}}"><span id="b-to-err" style="font-size: 12px; line-height: 1.4; color: #FF6B5E">{{e.to.msg}}</span></sc-if></div>
<div style="flex: 0.9 1 110px; display: flex; flex-direction: column; gap: 8px"><label for="b-cap" style="font-size: 13px; font-weight: 700">Capital (USD)</label><input id="b-cap" type="number" min="1" step="1" value="{{v.cap}}" onChange="{{on.cap}}" aria-invalid="{{e.cap.inv}}" aria-describedby="b-cap-err" style="height: 42px; padding: 0 12px; border: 1px solid {{e.cap.bd}}; border-radius: 8px; background: #0F141A; color: #E7ECF2; font-size: 15px"><sc-if value="{{e.cap.msg}}" hint-placeholder-val="{{false}}"><span id="b-cap-err" style="font-size: 12px; line-height: 1.4; color: #FF6B5E">{{e.cap.msg}}</span></sc-if></div>
<div style="flex: 1.6 1 180px; display: flex; flex-direction: column; gap: 8px"><label for="b-st" style="font-size: 13px; font-weight: 700">Strategy</label><select id="b-st" value="{{v.strategy}}" onChange="{{on.strategy}}" style="height: 42px; padding: 0 12px; border: 1px solid {{e.strategy.bd}}; border-radius: 8px; background: #0F141A; color: #E7ECF2; font-size: 15px"><sc-for list="{{stratOptions}}" as="o" hint-placeholder-count="4"><option value="{{o.value}}">{{o.label}}</option></sc-for></select><sc-if value="{{e.strategy.msg}}" hint-placeholder-val="{{false}}"><span id="b-st-err" style="font-size: 12px; line-height: 1.4; color: #FF6B5E">{{e.strategy.msg}}</span></sc-if></div>
<div style="flex: 0.8 1 110px; display: flex; flex-direction: column; gap: 8px"><label for="b-fee" style="font-size: 13px; font-weight: 700"><span class="cf-tip">Fee (%)<button type="button" class="cf-tipbtn" aria-label="What is Fee (%)?" aria-describedby="tip1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg></button><span role="tooltip" id="tip1" class="cf-tipbox">Exchange trading fee charged on each entry and exit, as a percent of the trade size.</span></span></label><input id="b-fee" type="number" min="0" max="1" step="0.01" value="{{v.fee}}" onChange="{{on.fee}}" aria-invalid="{{e.fee.inv}}" aria-describedby="b-fee-err" style="height: 42px; padding: 0 12px; border: 1px solid {{e.fee.bd}}; border-radius: 8px; background: #0F141A; color: #E7ECF2; font-size: 15px"><sc-if value="{{e.fee.msg}}" hint-placeholder-val="{{false}}"><span id="b-fee-err" style="font-size: 12px; line-height: 1.4; color: #FF6B5E">{{e.fee.msg}}</span></sc-if></div>
<div style="flex: 0.8 1 120px; display: flex; flex-direction: column; gap: 8px"><label for="b-slip" style="font-size: 13px; font-weight: 700"><span class="cf-tip">Slippage (bps)<button type="button" class="cf-tipbtn" aria-label="What is Slippage (bps)?" aria-describedby="tip2"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.5"></path></svg></button><span role="tooltip" id="tip2" class="cf-tipbox">Expected gap between the signal price and the price you actually get. 1 bps = 0.01%.</span></span></label><input id="b-slip" type="number" min="0" max="100" step="1" value="{{v.slip}}" onChange="{{on.slip}}" aria-invalid="{{e.slip.inv}}" aria-describedby="b-slip-err" style="height: 42px; padding: 0 12px; border: 1px solid {{e.slip.bd}}; border-radius: 8px; background: #0F141A; color: #E7ECF2; font-size: 15px"><sc-if value="{{e.slip.msg}}" hint-placeholder-val="{{false}}"><span id="b-slip-err" style="font-size: 12px; line-height: 1.4; color: #FF6B5E">{{e.slip.msg}}</span></sc-if></div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px">
<sc-if value="{{handoffNote}}" hint-placeholder-val="{{false}}"><span role="status" style="font-size: 14px; color: #A9C1FF">{{handoffNote}}</span></sc-if>
<sc-if value="{{hasErrors}}" hint-placeholder-val="{{false}}"><span role="alert" style="font-size: 14px; color: #FF6B5E">Fix {{errorCount}} field(s) above to run the backtest.</span></sc-if>
<button type="button" onClick="{{startRun}}" disabled="{{runDisabled}}" class="cf-pri" style="margin-left: auto; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 160px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px; background: #E7ECF2; color: #0B0E12; font-size: 15px; font-weight: 700; cursor: pointer">Run backtest</button>
</div>
</form>
<sc-if value="{{rs.show}}" hint-placeholder-val="{{false}}">
<section aria-labelledby="b-status" style="background: #12171E; border: 1px solid {{rs.bd}}; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px"><h2 id="b-status" style="margin: 0; font-size: 17px; font-weight: 600; overflow-wrap: anywhere">{{rs.title}}</h2><span style="padding: 2px 10px; border: 1px solid {{rs.bd}}; border-radius: 999px; font-size: 12px; font-weight: 700; color: {{rs.c}}">{{rs.label}}</span><span style="font-size: 13px; color: #9AA6B4">{{rs.meta}}</span></div>
<sc-if value="{{rs.running}}" hint-placeholder-val="{{false}}"><div role="progressbar" aria-label="Backtest progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{rs.pct}}" style="height: 8px; background: #232B35; border-radius: 999px; overflow: hidden"><div style="width: {{rs.pctW}}; height: 100%; background: #7AA2FF; transition: width 400ms linear"></div></div></sc-if>
<p role="status" style="margin: 0; font-size: 14px; line-height: 1.5; color: #C3CCD6">{{rs.text}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-if value="{{rs.running}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{cancelRun}}" disabled="{{cancelling}}" class="cf-sec" style="min-height: 40px; padding: 0 14px; border: 1px solid #3A4553; border-radius: 8px; background: none; color: #E7ECF2; font-size: 14px; font-weight: 600; cursor: pointer">{{cancelLabel}}</button></sc-if>
<sc-if value="{{rs.completed}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{rs.open}}" class="cf-pri" style="min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: #E7ECF2; color: #0B0E12; font-size: 14px; font-weight: 700; cursor: pointer">View run details</button></sc-if>
<sc-if value="{{rs.failed}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{rs.open}}" class="cf-sec" style="min-height: 40px; padding: 0 14px; border: 1px solid #3A4553; border-radius: 8px; background: none; color: #E7ECF2; font-size: 14px; font-weight: 600; cursor: pointer">View run details</button></sc-if>
<sc-if value="{{rs.ended}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{dismissStatus}}" class="cf-ghost" style="min-height: 40px; padding: 0 12px; border: 0; border-radius: 8px; background: none; color: #9AA6B4; font-size: 14px; font-weight: 600; cursor: pointer">Dismiss</button></sc-if>
</div>
</section>
</sc-if>
</sc-if>

<sc-if value="{{isRunsList}}" hint-placeholder-val="{{false}}">
<section aria-labelledby="b-runs" style="background: #12171E; border: 1px solid #252D38; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px"><h2 id="b-runs" style="margin: 0; font-size: 18px; font-weight: 600">Runs</h2><span style="font-size: 13px; color: #9AA6B4">Manual backtests, newest first. Each run keeps the settings and strategy rules it ran with.</span></div>
<sc-if value="{{hasRuns}}" hint-placeholder-val="{{true}}">
<ul style="margin: 0; padding: 0; list-style: none; border-top: 1px solid #232B35">
<sc-for list="{{runRows}}" as="r" hint-placeholder-count="3">
<li style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; padding: 14px 0; border-bottom: 1px solid #232B35">
<div style="flex: 999 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 4px"><button type="button" onClick="{{r.open}}" class="cf-ghost" style="align-self: flex-start; padding: 2px 0; border: 0; background: none; color: #E7ECF2; font-size: 15px; font-weight: 700; text-align: left; cursor: pointer; overflow-wrap: anywhere; text-decoration: underline; text-decoration-color: #3A4553; text-underline-offset: 4px">{{r.title}}</button><span style="font-size: 13px; color: #9AA6B4">{{r.meta}}</span></div>
<div style="flex: 1 1 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px 16px"><span style="padding: 2px 10px; border: 1px solid {{r.bd}}; border-radius: 999px; font-size: 12px; font-weight: 700; color: {{r.c}}">{{r.label}}</span><span style="font-size: 14px; color: #C3CCD6">{{r.result}}</span><button type="button" onClick="{{r.open}}" aria-label="Open run {{r.id}}" class="cf-sec" style="min-height: 40px; padding: 0 14px; border: 1px solid #3A4553; border-radius: 8px; background: none; color: #E7ECF2; font-size: 14px; font-weight: 600; cursor: pointer">Open</button></div>
</li>
</sc-for>
</ul>
</sc-if>
<sc-if value="{{noRuns}}" hint-placeholder-val="{{false}}"><div role="status" style="padding: 32px 20px; border: 1px dashed #374456; border-radius: 10px; background: #0E141B; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center"><strong style="font-size: 16px">No runs yet</strong><span style="font-size: 14px; color: #9AA6B4">Set up a backtest and run it. Every run is kept here with its settings.</span><button type="button" onClick="{{toNew}}" class="cf-pri" style="min-height: 44px; padding: 0 18px; border: 0; border-radius: 8px; background: #E7ECF2; color: #0B0E12; font-size: 15px; font-weight: 700; cursor: pointer">Set up a backtest</button></div></sc-if>
</section>
</sc-if>

<sc-if value="{{isDetail}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<button type="button" onClick="{{backToRuns}}" class="cf-ghost" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 8px 0 0; border: 0; background: none; color: #E7ECF2; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"></path></svg>All runs</button>
<section aria-labelledby="b-snap" style="background: #12171E; border: 1px solid {{d.bd}}; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px"><h2 id="b-snap" style="margin: 0; font-size: 20px; font-weight: 600; overflow-wrap: anywhere">{{d.title}}</h2><span style="padding: 2px 10px; border: 1px solid {{d.bd}}; border-radius: 999px; font-size: 12px; font-weight: 700; color: {{d.c}}">{{d.label}}</span><span style="font-size: 13px; color: #9AA6B4">{{d.meta}}</span></div>
<sc-if value="{{d.changed}}" hint-placeholder-val="{{false}}"><p role="note" style="margin: 0; padding: 10px 12px; border: 1px solid #5A4520; border-radius: 8px; background: #1F1A10; font-size: 14px; line-height: 1.5; color: #F2D28B">{{d.changedText}}</p></sc-if>
<sc-if value="{{d.running}}" hint-placeholder-val="{{false}}"><div role="progressbar" aria-label="Backtest progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{d.pct}}" style="height: 8px; background: #232B35; border-radius: 999px; overflow: hidden"><div style="width: {{d.pctW}}; height: 100%; background: #7AA2FF; transition: width 400ms linear"></div></div></sc-if>
<sc-if value="{{d.hasNote}}" hint-placeholder-val="{{false}}"><p role="status" style="margin: 0; padding: 10px 12px; border: 1px solid {{d.bd}}; border-radius: 8px; background: {{d.noteBg}}; font-size: 14px; line-height: 1.5; color: {{d.noteC}}">{{d.note}}</p></sc-if>
<h3 style="margin: 0; font-size: 14px; font-weight: 650">Settings used</h3>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px 16px; font-size: 14px">
<sc-for list="{{d.cfg}}" as="c" hint-placeholder-count="7"><div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><dt style="font-size: 12px; color: #9AA6B4">{{c.k}}</dt><dd style="margin: 0; overflow-wrap: anywhere">{{c.v}}</dd></div></sc-for>
</dl>
<h3 style="margin: 0; font-size: 14px; font-weight: 650">Strategy rules at run time</h3>
<ul style="margin: 0; padding: 0 0 0 18px; display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 1.5; color: #C3CCD6"><sc-for list="{{d.rules}}" as="ru" hint-placeholder-count="2"><li>{{ru}}</li></sc-for></ul>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-if value="{{d.running}}" hint-placeholder-val="{{false}}"><button type="button" onClick="{{d.cancel}}" disabled="{{cancelling}}" class="cf-sec" style="min-height: 40px; padding: 0 14px; border: 1px solid #3A4553; border-radius: 8px; background: none; color: #E7ECF2; font-size: 14px; font-weight: 600; cursor: pointer">{{cancelLabel}}</button></sc-if>
<sc-if value="{{d.ended}}" hint-placeholder-val="{{true}}"><button type="button" onClick="{{d.rerun}}" class="cf-pri" style="min-height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: #E7ECF2; color: #0B0E12; font-size: 14px; font-weight: 700; cursor: pointer">{{d.rerunLabel}}</button></sc-if>
<button type="button" onClick="{{d.edit}}" class="cf-sec" style="min-height: 40px; padding: 0 14px; border: 1px solid #3A4553; border-radius: 8px; background: none; color: #E7ECF2; font-size: 14px; font-weight: 600; cursor: pointer">Copy settings to a new backtest</button>
</div>
</section>
</div>
</sc-if>

<sc-if value="{{showResults}}" hint-placeholder-val="{{true}}">
<section aria-labelledby="b-res" style="background: #12171E; border: 1px solid #252D38; border-radius: 12px; padding: 16px 20px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px"><h2 id="b-res" style="margin: 0; font-size: 20px; font-weight: 600">{{runTitle}}</h2><span style="font-size: 13px; color: #9AA6B4">{{runMeta}}</span></div>
